# =============================================================================
# VexarDrive Fleet Ping Service — CI Pipeline
# =============================================================================
# Triggered on: push to any branch, PRs to main
# Pipeline: Test → Lint → Security Scan → Build → Image Scan → Push to ACR
#
# Key decisions:
#   - OIDC (federated credentials) for Azure login — no long-lived secrets
#   - Trivy for both dependency and container image scanning
#   - Image pushed to ACR only on main branch (tagged with SHA + latest)
#   - npm audit for known vulnerability detection
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication
  security-events: write

env:
  REGISTRY: vexaracr.azurecr.io
  IMAGE_NAME: fleet-ping-service

jobs:
  # ===========================================================================
  # Job 1: Test
  # ===========================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ===========================================================================
  # Job 2: Security Scan (Dependencies)
  # ===========================================================================
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail on moderate vulnerabilities

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"

  # ===========================================================================
  # Job 3: Build & Push Container Image
  # ===========================================================================
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    # Only push images on main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # Fail the build on CRITICAL/HIGH vulnerabilities

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"

      # Login to Azure using OIDC (no long-lived credentials)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name vexaracr

      - name: Push image to ACR
        run: |
          # Push all tags generated by metadata-action (sha-<7chars> + latest)
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            docker push "$tag"
          done
