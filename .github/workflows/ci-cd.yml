name: Fleet Ping CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: vexar-fleet-ping
  ACR_NAME: vexarfleetdevacr
  ACR_LOGIN_SERVER: vexarfleetdevacr.azurecr.io
  RESOURCE_GROUP: vexar-fleet-dev-rg
  CONTAINER_APP_NAME: vexar-fleet-dev-app
  APP_URL: https://vexar-fleet-dev-app.delightfuldune-b0ab28a6.centralindia.azurecontainerapps.io


# ============================================================
# TEST
# ============================================================

jobs:

  test:

    name: Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Syntax check
        run: npm run check


      - name: Run tests
        run: npm test


# ============================================================
# SECURITY
# ============================================================

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Dependency audit
        run: npm audit --audit-level=high


      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --only-verified


# ============================================================
# BUILD + CONTAINER SECURITY
# ============================================================

  build:

    name: Build Container

    runs-on: ubuntu-latest

    needs:
      - test
      - security

    # Only build/deploy from main.
    # Pull requests stop after test + security.
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # ACR Login
      # --------------------------------------------------------

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${ACR_NAME}"


      # --------------------------------------------------------
      # Generate immutable image tag
      # --------------------------------------------------------

      - name: Set image
        id: image
        run: |

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building image:"
          echo "${IMAGE}"


      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build image
        run: |

          docker build \
            --pull \
            -t "${{ steps.image.outputs.image }}" \
            .


      # --------------------------------------------------------
      # Container Vulnerability Scan
      # --------------------------------------------------------

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


      # --------------------------------------------------------
      # Push Image
      # --------------------------------------------------------

      - name: Push image
        run: |

          docker push \
            "${{ steps.image.outputs.image }}"


# ============================================================
# DEPLOY DEV
# ============================================================

  deploy-dev:

    name: Deploy Dev

    runs-on: ubuntu-latest

    needs:
      - build

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Deploy immutable image
      # --------------------------------------------------------

      - name: Deploy to Azure Container Apps
        run: |

          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ needs.build.outputs.image }}"


      # --------------------------------------------------------
      # Health Check
      # --------------------------------------------------------

      - name: Verify application health
        run: |

          echo "Checking application health..."

          for i in {1..12}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "${APP_URL}/health"; then

              echo ""
              echo "Application is healthy."

              exit 0

            fi

            echo "Application not ready yet. Attempt ${i}/12"

            sleep 10

          done

          echo "Application health check failed."

          exit 1