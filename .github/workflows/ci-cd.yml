name: Fleet Ping CI/CD

on:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main


permissions:
  contents: read


env:
  NODE_VERSION: "22"
  IMAGE_NAME: vexar-fleet-ping


# ------------------------------------------------------------
# TEST
# ------------------------------------------------------------

jobs:

  test:

    name: Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Syntax check
        run: npm run check


      - name: Run tests
        run: npm test


# ------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      - name: Install dependencies
        run: npm ci


      - name: Dependency audit
        run: npm audit --audit-level=high


      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --only-verified


# ------------------------------------------------------------
# BUILD + CONTAINER SCAN
# ------------------------------------------------------------

  build:

    name: Build Container

    runs-on: ubuntu-latest

    needs:
      - test
      - security

    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ secrets.ACR_NAME }}"


      - name: Set image
        id: image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building ${IMAGE}"


      - name: Build image
        run: |
          docker build \
            --pull \
            -t "${{ steps.image.outputs.image }}" \
            .


      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: ${{ steps.image.outputs.image }}

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: "1"


      - name: Push image
        run: |
          docker push \
            "${{ steps.image.outputs.image }}"


# ------------------------------------------------------------
# STAGING
# ------------------------------------------------------------

  deploy-staging:

    name: Deploy Staging

    runs-on: ubuntu-latest

    needs:
      - build

    environment:
      name: staging

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Login to Azure
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Deploy
        run: |

          az containerapp update \
            --name "${{ secrets.STAGING_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.STAGING_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"


      - name: Verify health
        env:
          APP_URL: ${{ secrets.STAGING_APP_URL }}

        run: |

          for i in {1..12}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "${APP_URL}/health"; then

              echo "Staging is healthy"

              exit 0

            fi

            echo "Waiting for staging..."

            sleep 10

          done

          echo "Staging health check failed"

          exit 1


# ------------------------------------------------------------
# PRODUCTION
# ------------------------------------------------------------

  deploy-production:

    name: Deploy Production

    runs-on: ubuntu-latest

    needs:
      - deploy-staging

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Login to Azure
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Deploy immutable image
        run: |

          az containerapp update \
            --name "${{ secrets.PROD_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.PROD_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"


      - name: Verify production
        env:
          APP_URL: ${{ secrets.PROD_APP_URL }}

        run: |

          for i in {1..12}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "${APP_URL}/health"; then

              echo "Production is healthy"

              exit 0

            fi

            echo "Waiting for production..."

            sleep 10

          done

          echo "Production health check failed"

          exit 1